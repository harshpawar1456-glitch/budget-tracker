<!DOCTYPE html>
<html lang="en" data-page="login">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in - Budget Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="auth.js"></script>
</head>
<body>

  <div class="page auth-page">

    <header class="header">
      <h1>Budget Tracker</h1>
      <p>Log in to see your income and expenses</p>
    </header>

    <section class="panel auth-panel">
      <h2>Log in</h2>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>

        <button type="submit" class="btn-primary">Log in</button>
      </form>

      <p id="authMessage" class="message" role="status"></p>

      <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
    </section>

  </div>

</body>
</html>
