<!DOCTYPE html>
<html lang="en" data-page="register">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account - Budget Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="auth.js"></script>
</head>
<body>

  <div class="page auth-page">

    <header class="header">
      <h1>Budget Tracker</h1>
      <p>Create an account to track your own budget</p>
    </header>

    <section class="panel auth-panel">
      <h2>Create account</h2>

      <form id="registerForm" class="auth-form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" autocomplete="name" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="new-password" placeholder="At least 8 characters" required />
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input type="password" id="confirmPassword" autocomplete="new-password" required />
        </div>

        <button type="submit" class="btn-primary">Create account</button>
      </form>

      <p id="authMessage" class="message" role="status"></p>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </section>

  </div>

</body>
</html>
